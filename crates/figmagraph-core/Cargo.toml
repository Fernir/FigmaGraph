[package]
name = "figmagraph-core"
version = "0.1.3"
edition = "2021"
description = "Rust indexer core for figmagraph (Layout IR + SQLite)"
license = "MIT"

[[bin]]
name = "figmagraph-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
